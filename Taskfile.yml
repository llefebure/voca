version: '3'

# Per-worktree dev-server ports, optional: written by scripts/worktree_env.py
# inside each agent worktree (stack mode); absent in the main checkout, where
# the defaults apply. Missing dotenv files are fine (verified: task ignores).
dotenv: ['.worktree.env']

vars:
  FRONTEND_PORT: '{{.FRONTEND_PORT | default "3000"}}'
  BACKEND_PORT: '{{.BACKEND_PORT | default "8000"}}'

tasks:
  supabase-start:
    desc: 'Start the local Supabase stack (stack mode: per worktree/branch project)'
    cmds:
      - supabase start

  supabase-stop:
    desc: Stop the local Supabase stack
    cmds:
      - supabase stop

  stop-backend:
    desc: Stop the backend server
    cmds:
      - lsof -ti:{{.BACKEND_PORT}} | xargs kill -9 || echo "Backend not running"

  stop-frontend:
    desc: Stop the frontend server
    cmds:
      - lsof -ti:{{.FRONTEND_PORT}} | xargs kill -9 || echo "Frontend not running"

  stop-all:
    desc: Stop all services (Supabase, Backend, Frontend)
    cmds:
      - task supabase-stop
      - task stop-backend
      - task stop-frontend

  supabase-migrate:
    desc: Apply database migrations
    cmds:
      - supabase migration up

  supabase-ready:
    desc: Ensure Supabase is running and migrated
    cmds:
      - task supabase-start
      - task supabase-migrate

  stack:list:
    desc: 'List all local Supabase stacks (one per worktree/branch in stack mode)'
    cmds:
      - supabase stack list

  env:sync:
    desc: Regenerate src/voca/.env, frontend/.env.local, .worktree.env from this worktree's local stack
    cmds:
      - uv run python scripts/worktree_env.py sync

  worktree:new:
    desc: 'Create an isolated agent worktree. Usage: uv run task worktree:new -- feature/<short-name> [base-ref]'
    cmds:
      - |
        set -e
        BRANCH="{{index (splitList " " (trim .CLI_ARGS)) 0 | trim}}"
        BASE="{{index (splitList " " (trim .CLI_ARGS)) 1 | trim}}"
        NAME="{{(splitList "/" (index (splitList " " (trim .CLI_ARGS)) 0)) | last}}"
        test -n "$NAME" || { echo "usage: uv run task worktree:new -- <branch-name> [base-ref]"; exit 1; }
        BASE="${BASE:-main}"
        test ! -e ".worktrees/$NAME" || { echo ".worktrees/$NAME already exists"; exit 1; }
        git worktree add ".worktrees/$NAME" -b "$BRANCH" "$BASE"
        cd ".worktrees/$NAME"
        uv sync
        (cd frontend && npm install)
        # Starts this worktree's own Supabase stack (stack-mode identity is
        # worktree path + branch) and writes its env files + ports.
        uv run python scripts/worktree_env.py sync
        echo "==> Worktree ready: cd .worktrees/$NAME && uv run task dev"

  worktree:remove:
    desc: 'Stop the worktree stack and remove the dir. Usage: uv run task worktree:remove -- <short-name>'
    cmds:
      - |
        set -e
        NAME="{{.CLI_ARGS | trim}}"
        test -n "$NAME" || { echo "usage: uv run task worktree:remove -- <short-name>"; exit 1; }
        test -d ".worktrees/$NAME" || { echo ".worktrees/$NAME does not exist"; exit 1; }
        (cd ".worktrees/$NAME" && supabase stop) || echo "stack already stopped or missing"
        git worktree remove ".worktrees/$NAME" || git worktree remove --force ".worktrees/$NAME"
        echo "==> Removed. Leftover stack data: 'supabase stack list' then 'supabase stack destroy --stack-id <id> --yes'"

  frontend:
    desc: Start frontend development server
    cmds:
      - cd frontend && npm run dev -- -p {{.FRONTEND_PORT}}

  backend:
    desc: Start backend development server
    cmds:
      - uv run uvicorn voca.main:app --host 0.0.0.0 --port {{.BACKEND_PORT}} --reload

  all:
    desc: Start both frontend and backend servers together
    deps:
      - frontend
      - backend

  dev:
    desc: Start everything (Supabase, Backend, Frontend) with one command
    cmds:
      - task supabase-ready
      - task all

  lint:
    desc: Run ruff linter
    cmds:
      - uv run ruff check .

  lint-fix:
    desc: Run ruff linter and fix safe errors
    cmds:
      - uv run ruff check --fix .

  format:
    desc: Run ruff formatter
    cmds:
      - uv run ruff format .

  tidy:
    desc: Fix lint errors and format code
    cmds:
      - task lint-fix
      - task format

  test:
    desc: Run the offline pytest suite (no Ollama or Supabase needed; integration tests excluded)
    env:
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy_key
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  test:all:
    desc: Run every test, including live-LLM integration tests (needs Ollama running locally)
    env:
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy_key
    cmds:
      - uv run pytest --override-ini="addopts=" {{.CLI_ARGS}}

  typecheck:
    desc: Typecheck the frontend
    cmds:
      - cd frontend && npm run typecheck

  lint:frontend:
    desc: Lint the frontend
    cmds:
      - cd frontend && npm run lint

  test:frontend:
    desc: Frontend unit/component tests (Vitest + RTL, offline, supabase mocked)
    cmds:
      - cd frontend && npm run test

  test:e2e:
    desc: Playwright browser smoke tests (needs `uv run task dev` running in another shell)
    # The canonical way to run the browser tests — env for the seeder comes
    # from src/voca/.env via this dotenv, so invoking `npx playwright test`
    # directly is NOT supported (it has no seeding env).
    dotenv: ['src/voca/.env']
    env:
      # Per-worktree dev server (E2E_BASE_URL read by playwright.config.ts).
      E2E_BASE_URL: 'http://localhost:{{.FRONTEND_PORT}}'
    cmds:
      - cd frontend && npx playwright test {{.CLI_ARGS}}

  check:frontend:
    desc: Typecheck + lint + unit tests for the frontend
    cmds:
      - task: typecheck
      - task: lint:frontend
      - task: test:frontend

  check:
    desc: Every automated gate (offline backend tests + ruff + frontend typecheck/lint/tests)
    cmds:
      - task test
      - task: lint
      - task check:frontend
